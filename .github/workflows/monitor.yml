name: G Hillstand ticket monitor

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: Send a Telegram confirmation after this check
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: g-hillstand-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify availability and notification rules
        run: python -m unittest discover -s tests -v
      - name: Install browser runtime
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: Check G Hillstand and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_STATE_TOKEN: ${{ github.token }}
          SEND_TEST: ${{ inputs.send_test && 'true' || 'false' }}
        run: python monitor.py
