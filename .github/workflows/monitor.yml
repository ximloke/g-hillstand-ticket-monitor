name: G Hillstand ticket monitor

on:
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
    inputs:
      send_test:
        description: Send a Telegram confirmation after this check
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: g-hillstand-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
      - name: Verify availability and notification rules
        run: python -m unittest discover -s tests -v
      - name: Install browser runtime
        run: |
          pip install --disable-pip-version-check -r requirements.txt
          python -m playwright install --with-deps --only-shell chromium
      - name: Check G Hillstand and notify
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_STATE_TOKEN: ${{ github.token }}
          SEND_TEST: ${{ inputs.send_test && 'true' || 'false' }}
        run: python monitor.py
      - name: Notify if the check could not run
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_STATE_TOKEN: ${{ github.token }}
        run: python3 monitor.py --failure-notice
